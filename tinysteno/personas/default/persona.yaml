name: Meeting Summary
tags: [meeting]
description: Extracts overview, participants, key points, and action items from a meeting transcript.
schema:
  overview:      {type: string, description: "A 2-4 sentence summary of the meeting"}
  participants:  {type: list,   description: "Names of people who attended (spoke or were confirmed present). Exclude people who were only mentioned or talked about."}
  key_points:    {type: list,   description: "3-7 major discussion points, one concise sentence each"}
  action_items:  {type: list,   description: "Concrete tasks someone explicitly committed to, each formatted as 'task (assignee)'. Include only firm commitments with a clear deliverable; exclude ideas, suggestions, and vague intentions. Name an assignee only when the transcript explicitly assigns the task or they volunteer; use 'unassigned' only when a real task has no clear owner. Empty list if nothing was committed."}
