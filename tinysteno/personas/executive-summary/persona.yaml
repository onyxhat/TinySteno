name: Executive Summary
tags: [executive, summary]
description: Produces a decision-ready executive briefing — bottom line, key decisions, risks, and asks — from a meeting transcript.
schema:
  bottom_line:   {type: string, description: "One sentence: the single most important outcome and what leadership must do — approve, fund, be aware, decide by a date, or explicitly nothing. State the ask directly; never imply it."}
  summary:       {type: string, description: "3-5 sentences, under 150 words. BLUF order: lead with the outcome, then risk level with effort and reversibility, then business impact on cost/stability/strategy, then the recommendation with timing. Attach the business consequence to every technical point."}
  key_decisions: {type: list,   description: "Decisions actually made, each stated as a claim with its consequence, not a topic label. One concise sentence each; empty list if none were made."}
  risks:         {type: list,   description: "Risks or concerns raised, each paired with its business consequence. Note reversibility or effort when the transcript gives it. One concise sentence each."}
  asks:          {type: list,   description: "Requests directed at stakeholders, formatted as 'ask (from whom)'. State what is requested and by when if given. Include only asks explicitly raised in the meeting."}
