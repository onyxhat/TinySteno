[project]
name = "tinysteno"
version = "0.2.8"
description = "Minimal meeting recorder with Obsidian export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.5",
    "numpy>=2.4.3",
    "openai>=2.29.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "soundfile>=0.13.1",
    "faster-whisper>=1.2.1",
    "pyobjc-framework-ScreenCaptureKit>=12.1; sys_platform == 'darwin'",
    "jinja2>=3.1.6",
    "scipy>=1.13",
    "textual>=8.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# uv installs the dev group by default, so `uv run pytest` works without flags.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.0",
    "pylint==4.0.5",
    "sherpa-onnx>=2.0.1",
]

[tool.setuptools.packages.find]
include = ["tinysteno*"]

[tool.setuptools.package-data]
"tinysteno.personas" = ["*/persona.yaml", "*/system_prompt.md", "*/template.md"]
"tinysteno.tui" = ["*.tcss"]

[project.scripts]
tinysteno = "tinysteno.main:main"

[project.optional-dependencies]
diarize = [
    "sherpa-onnx>=2.0.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
